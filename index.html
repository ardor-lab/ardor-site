  <title>Ardor | Gestão, Rotina e Margem para Negócios Locais</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@1,300;1,400&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F8F6F2;
      --card-bg: #FFFFFF;
      --dark-surface: #151311;
      --dark-card: #1F1B17;
      --terracotta: #bb5928;
      --terracotta-hover: #9c481e;
      --terracotta-soft: rgba(187, 89, 40, 0.08);
      --terracotta-glow: rgba(187, 89, 40, 0.28);
      --amber-gold: #c9882b;
      --amber-soft: rgba(201, 136, 43, 0.12);
      --text-main: #1D1A17;
      --text-muted: #5E5852;
      --text-light-muted: #9E968E;
      --border: #E6E1D7;
      --border-dark: #D1C9B8;
      --shadow-sm: 0 4px 18px rgba(35, 25, 18, 0.04);
      --shadow-md: 0 12px 34px rgba(35, 25, 18, 0.07);
      --shadow-xl: 0 24px 50px rgba(35, 25, 18, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .container {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* --- Scroll Reveal Fluido --- */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.12s; }
    .delay-2 { transition-delay: 0.22s; }

    /* --- Logótipo Flutuante --- */
    .brand-floating {
      position: fixed;
      top: 14px;
      left: max(24px, calc((100vw - 1080px) / 2 + 24px));
      z-index: 2147483647;
      display: inline-flex;
      align-items: center;
      height: 88px;
      cursor: pointer;
      user-select: none;
      transform-origin: left center;
      transition: opacity 0.3s ease, transform 0.3s ease, top 0.3s ease;
      will-change: opacity, transform;
    }

    .brand-floating.scrolled {
      opacity: 0.35;
      top: 10px;
      transform: scale(0.80) translate3d(0, 0, 0);
    }

    .brand-floating:hover {
      opacity: 1 !important;
      transform: scale(0.84) translate3d(0, 0, 0);
    }

    .brand-logo-img {
      height: 88px;
      width: auto;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 4px 14px rgba(187, 89, 40, 0.22));
    }

    /* --- Barra Superior --- */
    .top-bar {
      min-height: 105px;
      padding: 16px 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-link {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      padding: 9px 20px;
      border-radius: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-link:hover {
      color: var(--terracotta);
      background: var(--terracotta-soft);
    }

    .nav-link-cta {
      border: 1.5px solid var(--terracotta);
      color: var(--terracotta) !important;
      background: #FFFFFF;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .nav-link-cta:hover {
      background: var(--terracotta) !important;
      color: #FFFFFF !important;
      transform: translateY(-1px);
    }

    /* --- Bloco Hero --- */
    .hero {
      padding: 60px 0 70px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
      position: relative;
    }

    .hero-quote {
      font-family: 'Merriweather', serif;
      font-style: italic;
      font-size: 1.02rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      border-left: 3px solid var(--terracotta);
      padding: 8px 0 8px 16px;
      background: linear-gradient(90deg, rgba(187, 89, 40, 0.08), transparent);
      border-radius: 0 8px 8px 0;
    }

    .hero h1 {
      font-size: 2.85rem;
      line-height: 1.14;
      font-weight: 900;
      letter-spacing: -0.9px;
      margin-bottom: 20px;
    }

    .hero h1 span.highlight {
      color: var(--terracotta);
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 34px;
      max-width: 540px;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--terracotta);
      color: #FFFFFF;
      padding: 17px 36px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 22px rgba(187, 89, 40, 0.35);
      border: none;
      cursor: pointer;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-25deg);
      transition: left 0.75s ease;
    }

    .btn:hover::before {
      left: 140%;
    }

    .btn:hover {
      background: var(--terracotta-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(187, 89, 40, 0.45);
    }

    .proof-frame {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      box-shadow: var(--shadow-xl);
      transition: transform 0.4s ease;
    }

    .proof-frame:hover {
      transform: translateY(-4px);
    }

    .proof-img {
      width: 100%;
      height: 405px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .proof-badge {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(21, 19, 17, 0.92);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .proof-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 10px #34D399;
    }

    /* --- Métricas Rápidas --- */
    .metrics-bar {
      background: linear-gradient(180deg, #181513 0%, #110F0E 100%);
      color: #FFFFFF;
      padding: 50px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .metric-card {
      border-left: 2.5px solid var(--terracotta);
      padding-left: 18px;
    }

    .metric-number {
      font-size: 2.3rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
      letter-spacing: -0.6px;
    }

    .metric-number span {
      color: var(--amber-gold);
    }

    .metric-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-light-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.4;
    }

    /* --- Soluções Aplicadas (Abas) --- */
    .interactive-section {
      padding: 95px 0;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
    }

    .section-header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 34px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--amber-gold);
      background: var(--amber-soft);
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }

    .section-desc {
      font-size: 0.98rem;
      color: var(--text-muted);
    }

    .tabs-nav-wrapper {
      background: #EDE8DE;
      padding: 7px;
      border-radius: 14px;
      display: inline-flex;
      gap: 8px;
      margin-bottom: 34px;
      border: 1px solid var(--border-dark);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-btn {
      background: transparent;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 13px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.22s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.65);
    }

    .tab-btn.active {
      background: #FFFFFF !important;
      color: var(--terracotta) !important;
      box-shadow: 0 4px 16px rgba(45, 35, 25, 0.09);
      font-weight: 800;
    }

    .tab-btn.active::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--terracotta);
    }

    .tab-content {
      display: none;
      animation: fadeInTab 0.35s ease forwards;
    }

    .tab-content.active {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 40px;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 38px 34px;
      box-shadow: var(--shadow-sm);
    }

    @keyframes fadeInTab {
      from { opacity: 0; transform: translateY(12px); }
